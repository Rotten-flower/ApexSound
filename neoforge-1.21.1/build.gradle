plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }

group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-neoforge-1.21.1" }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
def resourceProps = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors, mod_license: mod_license, mod_description: mod_description]
processResources {
    inputs.properties resourceProps
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'fabric.mod.json']) { expand resourceProps }
}

neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server { server(); gameDirectory = project.file('run-server'); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
dependencies { if (project.hasProperty('profile')) runtimeOnly "maven.modrinth:spark:${spark_version}" }
dependencies {
    compileOnly files('work/compat/tacz-port.jar')
    if (project.hasProperty('tacz')) runtimeOnly files('work/compat/tacz-port.jar')
}

// mcscene-v2: development only; never part of the published main JAR.
sourceSets { gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
if (!project.hasProperty('tacz')) sourceSets.gameTest.java.exclude '**/TaczPortProbe.java'
neoForge { runs { client { if (project.hasProperty('mcscene')) { gameDirectory = project.file('run/mcscene-client') } } }; mods { apex_sound_effects { if (project.hasProperty('mcscene')) { sourceSet sourceSets.gameTest } } } }

tasks.withType(ProcessResources).configureEach { filteringCharset = "UTF-8" }

// 代码与素材许可分开打包。 / Package code and asset terms separately.
tasks.named('jar', Jar) {
    from('../LICENSE')
    from('../LICENSE-ASSETS.md')
}
